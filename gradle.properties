org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=false
android.nonTransitiveRClass=true

kotlin.code.style=official

# 自签名 keystore（仅侧载用，不入库）。
#
# 口令刻意不写进仓库。要构建「可覆盖安装的」release，在你自己的
# ~/.gradle/gradle.properties（或命令行 -P）里提供：
#   RB_STORE_FILE=/path/to/your.jks
#   RB_STORE_PASSWORD=***
#   RB_KEY_ALIAS=***
#   RB_KEY_PASSWORD=***
#
# 没提供口令时 release 回落 debug 签名——能构建、能装，只是签名不同，
# 换签名后必须先卸载旧版。
RB_STORE_FILE=keystore/rimebridge.jks
